<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" />

    <title>Helixa Olympiad — Olimpiade Online Matematika &amp; Biologi untuk SMA</title>
    <meta
      name="description"
      content="Helixa Olympiad adalah olimpiade online untuk siswa SMA yang fokus pada Matematika dan Biologi, dengan pembahasan lengkap dan laporan kemampuan per siswa."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="Helixa Olympiad" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="Helixa Olympiad" />
    <meta
      property="og:description"
      content="Olimpiade online Matematika &amp; Biologi untuk siswa SMA. Edisi Perdana, gratis."
    />

    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.png" />

    <!-- Font di-host sendiri (variable woff2, total ~62 kB): preload di sini
         membuat teks tampil dengan font-final tanpa hop ke pihak ketiga, dan
         tanpa stylesheet render-blocking Google Fonts. `%BASE_URL%` diganti Vite
         supaya ikut benar di GitHub Pages project page. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="%BASE_URL%fonts/manrope-latin-var.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="%BASE_URL%fonts/cormorant-garamond-latin-var.woff2"
      crossorigin
    />

    <!-- Fallback agar konten tetap terbaca meski stylesheet gagal -->
    <style>
      html { background-color: #0a0a0b; color: #f4efe4; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
