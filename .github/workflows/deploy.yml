name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows manual re-run from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel an in-progress deploy when a new commit lands
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Fallback base path for the project page. `configure-pages` normally supplies
  # this; the fallback keeps the build correct even if that step cannot run.
  FALLBACK_BASE: /helixa-olympiad

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Reads the Pages site to learn its real base path. A project page is
      # served from /<repo>/, so every asset must carry that prefix.
      #
      # This step is allowed to fail: the built-in GITHUB_TOKEN is not allowed
      # to create a Pages site ("Resource not accessible by integration"), so it
      # reports Not Found until Pages has been switched on once in
      # Settings > Pages > Source: GitHub Actions. Failing softly here keeps the
      # build green and the artifact uploadable regardless.
      - id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build
        env:
          PUBLIC_BASE: ${{ steps.pages.outputs.base_path || env.FALLBACK_BASE }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
