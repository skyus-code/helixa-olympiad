name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows manual re-run from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel an in-progress deploy when a new commit lands
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Resolves the Pages site so `base_path` is correct for a project page
      # (served from /<repo>/). `enablement: true` turns Pages on via the
      # built-in GITHUB_TOKEN, so no manual setting in the repo is required.
      - id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build
        run: npm run build
        env:
          PUBLIC_BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
